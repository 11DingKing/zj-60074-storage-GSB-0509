version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_zj_60074
    restart: always
    environment:
      POSTGRES_DB: db_zj_60074
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123456
    ports:
      - '15074:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_zj_60074
    restart: always
    ports:
      - '16374:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
